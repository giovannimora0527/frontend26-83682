<div class="sesion">
  @if (usuario) {
    <div class="sesion__usuario">
      <strong>{{ usuario.username }}</strong>
      <small>{{ rol }}</small>
    </div>
  }
  <button type="button" class="btn btn-sm btn-danger m-0" [disabled]="cerrando" (click)="cerrarSesion()">
    <i class="feather icon-log-out" aria-hidden="true"></i>
    {{ cerrando ? 'Cerrando...' : 'Cerrar sesión' }}
  </button>
</div>
