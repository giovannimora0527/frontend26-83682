<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <h5 class="mb-3">{{ titulo }}</h5>
            <div class="row align-items-end">
                <div class="col-md-5 mb-2">
                    <input class="form-control" [placeholder]="'Buscar en ' + titulo.toLowerCase()" type="text"
                        (input)="actualizarBusqueda($event)" />
                </div>
                <div class="col-md-7 mb-2">
                    <ng-content select="[filtros]"></ng-content>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th class="text-center" *ngFor="let col of columnas">{{ col.titulo }}</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="items.length === 0">
                        <tr>
                            <td [attr.colspan]="columnas.length" class="text-center">No hay registros</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="items.length > 0 && filtrados.length === 0">
                        <tr>
                            <td [attr.colspan]="columnas.length" class="text-center">No se encontraron resultados</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="filtrados.length > 0">
                        <tr *ngFor="let item of paginados">
                            <td class="text-center" *ngFor="let col of columnas">{{ col.valor(item) }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav *ngIf="totalPaginas > 1" aria-label="Paginación">
                <ul class="pagination justify-content-end mb-0">
                    <li class="page-item" [class.disabled]="paginaActual === 1">
                        <button class="page-link" type="button" [disabled]="paginaActual === 1"
                            (click)="cambiarPagina(paginaActual - 1)">Anterior</button>
                    </li>
                    <li class="page-item" *ngFor="let pagina of paginas" [class.active]="pagina === paginaActual">
                        <button class="page-link" type="button" (click)="cambiarPagina(pagina)">{{ pagina }}</button>
                    </li>
                    <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
                        <button class="page-link" type="button" [disabled]="paginaActual === totalPaginas"
                            (click)="cambiarPagina(paginaActual + 1)">Siguiente</button>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
